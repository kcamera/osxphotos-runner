[project]
name = "osxphotos-runner"
version = "0.1.0"
description = "Headless scheduled backup runner for an iCloud Photos library, using osxphotos"
requires-python = ">=3.13"
dependencies = [
    "osxphotos>=0.76.1,<0.77",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osxphotos_runner"]
